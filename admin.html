<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Sikshak Seva | Admin Panel</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f6fa;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#0759a5,#0878d1);
  color:white;
  padding:18px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  padding:22px;
  margin-bottom:20px;
  border-radius:14px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

h2{
  color:#0759a5;
  margin-top:0;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  margin:6px 0 14px;
  border:1px solid #ccd4df;
  border-radius:7px;
  font-family:inherit;
  font-size:15px;
}

textarea{
  min-height:90px;
  resize:vertical;
}

button{
  border:0;
  padding:11px 17px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
  margin-right:7px;
  margin-bottom:7px;
}

.primary{
  background:#0759a5;
  color:white;
}

.success{
  background:#16803c;
  color:white;
}

.danger{
  background:#d92d20;
  color:white;
}

.secondary{
  background:#667085;
  color:white;
}

.hidden{
  display:none;
}

.service-item{
  border:1px solid #e0e5eb;
  border-radius:10px;
  padding:15px;
  margin-bottom:12px;
  background:#fafcff;
}

.service-item h3{
  margin:0 0 5px;
  color:#0759a5;
}

.service-item p{
  margin:5px 0;
  color:#555;
}

.service-url{
  color:#0878d1;
  word-break:break-all;
  font-size:13px;
}

.status{
  padding:10px;
  border-radius:7px;
  margin-top:10px;
  background:#eef6ff;
  color:#0759a5;
}

.login-box{
  max-width:420px;
  margin:60px auto;
}

label{
  font-weight:bold;
  font-size:14px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:20px;
  color:#777;
}

@media(max-width:600px){

  .container{
    margin:15px auto;
  }

  .card{
    padding:16px;
  }

}

</style>

</head>

<body>


<header>

<h1>📚 Sikshak Seva — Admin Panel</h1>

</header>


<!-- LOGIN -->

<div id="loginSection" class="container">

<div class="card login-box">

<h2>🔐 Admin Login</h2>

<label>Email</label>

<input
id="email"
type="email"
placeholder="Admin Email"
>

<label>Password</label>

<input
id="password"
type="password"
placeholder="Password"
>

<button
class="primary"
onclick="login()"
>
Login
</button>

<div id="loginStatus"></div>

</div>

</div>



<!-- DASHBOARD -->

<div
id="dashboard"
class="container hidden"
>


<div class="card">

<div class="topbar">

<h2>⚙️ Dashboard</h2>

<button
class="danger"
onclick="logout()"
>
Logout
</button>

</div>

<p>
यहाँ से आप अपनी वेबसाइट का Notice और Services/Links manage कर सकते हैं।
</p>

</div>



<!-- NOTICE -->

<div class="card">

<h2>📢 Website Notice</h2>

<textarea
id="notice"
placeholder="Website पर दिखाई देने वाली महत्वपूर्ण सूचना लिखें..."
></textarea>

<button
class="success"
onclick="saveNotice()"
>
💾 Save Notice
</button>

<div
id="noticeStatus"
class="status"
></div>

</div>



<!-- ADD SERVICE -->

<div class="card">

<h2>➕ Add New Service / Link</h2>

<label>Service Name *</label>

<input
id="linkTitle"
type="text"
placeholder="जैसे Bihar Teacher Portal"
>

<label>Description</label>

<textarea
id="linkDescription"
placeholder="इस service के बारे में छोटी जानकारी"
></textarea>

<label>Website URL *</label>

<input
id="linkUrl"
type="url"
placeholder="https://example.com"
>

<label>Category</label>

<select id="linkCategory">

<option value="Teacher Services">
Teacher Services
</option>

<option value="Education">
Education
</option>

<option value="Bihar">
Bihar
</option>

<option value="Government">
Government
</option>

<option value="Other">
Other
</option>

</select>

<button
class="primary"
onclick="addService()"
>
➕ Add Service
</button>

<button
class="secondary"
onclick="clearServiceForm()"
>
↻ Clear
</button>

<div
id="serviceStatus"
class="status"
></div>

</div>



<!-- SERVICES LIST -->

<div class="card">

<h2>📋 Added Services</h2>

<div id="linksList">

<div class="empty">
Services load हो रही हैं...
</div>

</div>

</div>


</div>



<script type="module">


/* FIREBASE */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  serverTimestamp,
  query,
  orderBy
} from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyDZPFvTAAWQoinrU0p4r0p5pH61qqSqFtbIQ",

  authDomain:
  "sikshak-seva.firebaseapp.com",

  projectId:
  "sikshak-seva",

  storageBucket:
  "sikshak-seva.firebasestorage.app",

  messagingSenderId:
  "750757646957",

  appId:
  "1:750757646957:web:cf048a8fb745578b2fe564",

  measurementId:
  "G-0W5HG4QD7F"

};



const app =
initializeApp(firebaseConfig);


const auth =
getAuth(app);


const db =
getFirestore(app);



/* LOGIN */

window.login = async function(){

  const email =
  document.getElementById("email").value.trim();

  const password =
  document.getElementById("password").value;


  if(!email || !password){

    document.getElementById("loginStatus")
    .innerHTML =
    "<p style='color:#d92d20'>Email और Password भरें।</p>";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    document.getElementById("loginStatus")
    .innerHTML =
    "<p style='color:#d92d20'>Login failed. Email या Password जांचें।</p>";

  }

};



/* AUTH STATE */

onAuthStateChanged(
  auth,
  async user => {

    if(user){

      document
      .getElementById("loginSection")
      .classList.add("hidden");


      document
      .getElementById("dashboard")
      .classList.remove("hidden");


      await loadNotice();

      await loadServices();

    }else{

      document
      .getElementById("loginSection")
      .classList.remove("hidden");


      document
      .getElementById("dashboard")
      .classList.add("hidden");

    }

  }
);



/* LOGOUT */

window.logout = async function(){

  await signOut(auth);

};



/* LOAD NOTICE */

async function loadNotice(){

  try{

    const ref =
    doc(db,"website","content");

    const snap =
    await getDoc(ref);


    if(snap.exists()){

      const data =
      snap.data();

      document
      .getElementById("notice")
      .value =
      data.notice || "";

    }

  }catch(error){

    console.error(error);

  }

}



/* SAVE NOTICE */

window.saveNotice = async function(){

  const notice =
  document
  .getElementById("notice")
  .value
  .trim();


  try{

    await setDoc(

      doc(
        db,
        "website",
        "content"
      ),

      {
        notice:notice,
        updatedAt:serverTimestamp()
      },

      {
        merge:true
      }

    );


    document
    .getElementById("noticeStatus")
    .innerText =
    "✅ Notice successfully saved!";


  }catch(error){

    console.error(error);

    document
    .getElementById("noticeStatus")
    .innerText =
    "❌ Notice save नहीं हुआ।";

  }

};



/* ADD SERVICE */

window.addService = async function(){

  const title =
  document
  .getElementById("linkTitle")
  .value
  .trim();


  const description =
  document
  .getElementById("linkDescription")
  .value
  .trim();


  const url =
  document
  .getElementById("linkUrl")
  .value
  .trim();


  const category =
  document
  .getElementById("linkCategory")
  .value;


  if(!title || !url){

    document
    .getElementById("serviceStatus")
    .innerText =
    "⚠️ Service Name और URL जरूरी है।";

    return;

  }


  if(
    !url.startsWith("http://") &&
    !url.startsWith("https://")
  ){

    document
    .getElementById("serviceStatus")
    .innerText =
    "⚠️ URL https:// या http:// से शुरू होना चाहिए।";

    return;

  }


  try{

    await addDoc(

      collection(db,"links"),

      {
        title:title,
        description:description,
        url:url,
        category:category,
        createdAt:serverTimestamp()
      }

    );


    document
    .getElementById("serviceStatus")
    .innerText =
    "✅ Service successfully added!";


    clearServiceForm();


    await loadServices();


  }catch(error){

    console.error(error);

    document
    .getElementById("serviceStatus")
    .innerText =
    "❌ Service add नहीं हुई।";

  }

};



/* CLEAR SERVICE FORM */

window.clearServiceForm = function(){

  document
  .getElementById("linkTitle")
  .value="";


  document
  .getElementById("linkDescription")
  .value="";


  document
  .getElementById("linkUrl")
  .value="";


  document
  .getElementById("linkCategory")
  .value="Teacher Services";

};



/* LOAD SERVICES */

async function loadServices(){

  const list =
  document
  .getElementById("linksList");


  list.innerHTML =
  "<div class='empty'>Loading...</div>";


  try{

    const q =
    query(
      collection(db,"links"),
      orderBy("createdAt","desc")
    );


    const snapshot =
    await getDocs(q);


    if(snapshot.empty){

      list.innerHTML =
      "<div class='empty'>अभी कोई नई Service नहीं जोड़ी गई है।</div>";

      return;

    }


    list.innerHTML="";


    snapshot.forEach(item=>{

      const data =
      item.data();


      const div =
      document.createElement("div");


      div.className =
      "service-item";


      div.innerHTML = `

        <h3>
        ${escapeHTML(data.title || "")}
        </h3>

        <p>
        ${escapeHTML(data.description || "")}
        </p>

        <div class="service-url">
        ${escapeHTML(data.url || "")}
        </div>

        <p>
        <b>Category:</b>
        ${escapeHTML(data.category || "Other")}
        </p>

        <button
        class="danger"
        onclick="deleteService('${item.id}')"
        >
        🗑️ Delete
        </button>

      `;


      list.appendChild(div);

    });


  }catch(error){

    console.error(error);

    list.innerHTML =
    "<div class='empty'>❌ Services load नहीं हो सकीं।</div>";

  }

}



/* DELETE SERVICE */

window.deleteService = async function(id){

  if(
    !confirm(
      "क्या आप इस Service को delete करना चाहते हैं?"
    )
  ){

    return;

  }


  try{

    await deleteDoc(
      doc(db,"links",id)
    );


    await loadServices();


  }catch(error){

    console.error(error);

    alert(
      "Service delete नहीं हुई।"
    );

  }

};



/* SECURITY FOR DISPLAY */

function escapeHTML(value){

  return String(value)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


</script>

</body>
</html>
